services:
  postgres:
    image: postgres:18-alpine
    container_name: localingo-postgres
    environment:
      POSTGRES_DB: localingo
      POSTGRES_USER: localingo_user
      POSTGRES_PASSWORD: localingo_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localingo_user -d localingo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - localingo-network

volumes:
  postgres_data:

networks:
  localingo-network:
